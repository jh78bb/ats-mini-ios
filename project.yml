name: ATSMiniRemote
options:
  bundleIdPrefix: com.hoon
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  ATSMiniRemote:
    type: application
    platform: iOS
    sources: [ATSMiniRemote]
    info:
      path: ATSMiniRemote/Info.plist
      properties:
        CFBundleDisplayName: ATS Mini Remote
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIUserInterfaceStyle: Dark
        NSBluetoothAlwaysUsageDescription: Used to find your ATS Mini receiver over Bluetooth and control it.
        NSLocalNetworkUsageDescription: Used to find and connect to your ATS Mini receiver over Wi-Fi.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoon.ATSMiniRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
  ATSMiniRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ATSMiniRemoteTests]
    dependencies:
      - target: ATSMiniRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hoon.ATSMiniRemoteTests
